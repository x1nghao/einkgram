# Einkgram — GitHub Pages deployment
#
# Builds the production bundle and deploys to GitHub Pages
# on every push to main. Also supports manual trigger via
# the Actions tab.
#
# Required secrets: NONE (uses GITHUB_TOKEN which is auto-
# provided by Actions).
#
# Required permissions: Pages (Write), Id token (Write) for
# the production deployment step. The first run will fail
# if Pages isn't enabled in repo settings; enable it under
# Settings → Pages → Source: "GitHub Actions".
#
# Yellow zone: this file is a NEW file, not a modification
# of upstream. We add it once and never rebase.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    # Manual trigger from the Actions tab.

# Allow only one concurrent deployment; queue new pushes
# while a deployment is in progress. Cancel in-progress
# runs that are for the same ref.
concurrency:
  group: pages
  cancel-in-progress: false

# Default to bash; pin to Node 22 to match dev environment.
env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build Einkgram
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history isn't needed for a Pages deploy.
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Build production bundle
        working-directory: src
        run: npm run build:production
        env:
          # These can be set per-deploy; the build succeeds
          # without them (the user fills in api_id later
          # when they log in for the first time).
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          # For PWA: we keep the default icons. Override
          # here if you fork and want different branding.
          TG_APP_NAME: 'Einkgram'
          APP_TITLE: 'Einkgram'

      - name: Cleanup dist for E-Ink deployment
        # Removes build-stats.json (96 MB) and replaces
        # the 160-px emoji folder with a symlink to the
        # 64-px folder. After this step dist/ is ~67 MB
        # on disk (~38 MB gzipped, what GitHub Pages
        # actually serves).
        run: bash dev/cleanup-dist.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    # Only deploy on push to main, OR on manual trigger.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
