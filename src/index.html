<!DOCTYPE html>
<!--
  Einkgram v0.10 — anti-flicker architecture.

  Why html.class is hard-coded here:
  Upstream's theme logic runs in JS *after* the first paint.
  If we let <html> start with no theme-* class, the browser
  uses prefers-color-scheme to pick dark or light, and users
  on dark-mode systems see a black flash for ~440ms before
  init.ts adds theme-light. This is the flash your screenshot
  shows (black header, dark sidebar, dark chat list).

  By hard-coding theme-light + eink-mode in the HTML
  attribute, the very first paint already has the right
  classes. The actual visual styling (colors, contrast,
  dithering) comes from inline CSS in the next <style>
  block, which is parsed before any external stylesheet.

  init.ts will then read localStorage for the user's
  preferred eink variant (1bit / paper / off) and adjust
  the class accordingly — without a visible flash because
  the values are already what the user last selected.
-->
<html lang="en" translate="no" class="notranslate theme-light eink-mode eink-paper">

<head>
  <meta charset="UTF-8">

  <title>
    %TG_APP_TITLE%
  </title>

  <meta name="title" content="%TG_APP_TITLE%">
  <meta name="description"
    content="Telegram is a cloud-based mobile and desktop messaging app with a focus on security and speed.">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-title" content="%TG_APP_TITLE%">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="%TG_APP_TITLE%">
  <meta name="application-name" content="%TG_APP_TITLE%">
  <meta name="msapplication-TileColor" content="#2b5797">
  <meta name="msapplication-config" content="./browserconfig.xml">
  <meta name="theme-color" content="#ffffff">
  <meta name="google" content="notranslate">

  <meta http-equiv="Content-Security-Policy" content="%TG_CSP%">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="%TG_PUBLIC_URL%">
  <meta property="og:title" content="%TG_APP_TITLE%">
  <meta property="og:description"
        content="Telegram is a cloud-based mobile and desktop messaging app with a focus on security and speed.">
  <meta property="og:image" content="./%TG_MAIN_ICON%.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="%TG_PUBLIC_URL%">
  <meta property="twitter:title" content="%TG_APP_TITLE%">
  <meta property="twitter:description"
    content="Telegram is a cloud-based mobile and desktop messaging app with a focus on security and speed.">
  <meta property="twitter:image" content="./%TG_MAIN_ICON%.png">

  <link rel="canonical" href="%TG_PUBLIC_URL%">
  <link rel="apple-touch-icon" sizes="180x180" href="./%TG_APPLE_ICON%.png">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./%TG_MAIN_ICON%.png">
  <link rel="alternate icon" href="./favicon.ico" type="image/x-icon">
  <link rel="manifest" id="the-manifest-placeholder" href="./%TG_MANIFEST%">

  <script vite-ignore src="./redirect.js"></script>
  <!--
    Einkgram v0.10 — anti-flicker inline CSS.

    This block paints BEFORE any external stylesheet and
    BEFORE JS runs. It locks the body to paper-white,
    ink-black, no pattern background, and 16-gray filter,
    so the first frame the user sees is already E-Ink-ready
    regardless of system color-scheme or theme state.

    Specificity is intentionally aggressive (!important)
    because upstream has many !important rules of its own
    and we must win on the very first paint.

    See src/styles/eink/_mode.scss for the long-term CSS
    that takes over after the stylesheets load. The two
    MUST stay in sync.
  -->
  <style>
    /* 1. Lock the document to a paper-white / ink-black baseline. */
    html.theme-light.eink-mode,
    html.theme-light.eink-mode body {
      background-color: #ffffff !important;
      color: #000000 !important;
      color-scheme: light !important;
    }

    /* 2. Force light scrollbars and form controls even if the
          browser was about to render them dark. */
    html.theme-light.eink-mode {
      color-scheme: light;
    }

    /* 3. E-Ink grayscale filter on the whole UI, including the
          brief moment before _mode.scss has loaded. */
    html.theme-light.eink-mode {
      filter: grayscale(1) contrast(1.05);
    }

    /* 4. Override upstream's theme-light CSS variables. Upstream
          injects these via <style> in JS, but uses dark values
          for many of them. We force the E-Ink palette with
          !important, which beats any specificity. This block
          MUST be kept in sync with src/styles/eink/_tokens.scss. */
    html.theme-light.eink-mode {
      --color-background: #ffffff !important;
      --color-background-secondary: #f4f4f5 !important;
      --color-background-secondary-accent: #e4e4e5 !important;
      --color-background-sidebar: #e4e4e5 !important;
      --color-background-own: #eeffde !important;
      --color-background-selected: #f4f4f5 !important;
      --color-text: #000000 !important;
      --color-text-secondary: #707579 !important;
      --color-icon-secondary: #707579 !important;
      --color-borders: #dadce0 !important;
      --color-borders-input: #dadce0 !important;
      --color-dividers: #c8c6cc !important;
      --color-primary: #3390ec !important;
      --color-links: #3390ec !important;
      --color-chat-hover: #f4f4f5 !important;
      --color-chat-active: #3390ec !important;
      --color-chat-username: #3C7EB0 !important;
      --color-item-hover: #f4f4f5 !important;
      --color-item-active: #ededed !important;
      --color-reply-hover: #f4f4f5 !important;
      --color-reply-active: #ededed !important;
      --color-message-reaction: #ebf3fd !important;
      --color-message-reaction-hover: #c5def9 !important;
      --color-message-reaction-own: #cef0ba !important;
      --color-message-reaction-hover-own: #b5e0a4 !important;
      --color-composer-button: #707579cc !important;
      --color-toast-background: #202020cc !important;
      --color-error: #e53935 !important;
      --color-success: #00c73e !important;
      --color-warning: #fb8c00 !important;
    }

    /* 5. The pattern-background div is rendered with a CSS
          Module hash (Y7owXZmb at build time). We don't know
          the exact hash, so we use the structural hint: any
          direct child of body that is position:absolute and
          covers the viewport is the pattern overlay. Until
          init/patternSuppress.ts runs and tags it with
          data-eink-no-pattern, hide it via opacity. */
    html.theme-light.eink-mode body > div[style*="position: absolute"],
    html.theme-light.eink-mode body > div[style*="position: fixed"] {
      background-image: none !important;
    }

    /* 6. Upstream layer order for everything else. */
    @layer reset, variables, ui, components;
    @layer ui {
      @layer tablist, spinner, button, input, layout;
    }
  </style>
</head>

<body id="root" style="margin: 0; background-color: #ffffff; color: #000000;">
  <noscript>
    <video src="./nojs.mp4" class="nojs-video" muted loop autoplay playsinline disablePictureInPicture></video>
    <h1>Telegram Web</h1>
    <p>Please, enable JavaScript to open the app.</p>
  </noscript>
  <!-- Einkgram v0.9: pre-React loading screen. Shown before
       React mounts and replaced/hidden by src/eink/init.ts
       once the app is interactive. Pure inline CSS, no JS
       required, so it paints on the very first frame with
       zero dependencies. -->
  <div id="eink-loading-screen" role="status" aria-live="polite" style="
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 2rem;
    background-color: #ffffff;
    color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 1rem;
    font-weight: 500;
    line-height: 1.5;
    text-align: center;
    box-sizing: border-box;
    margin: 0;
  ">
    <div style="margin-bottom: 1.5rem; letter-spacing: 0.025em;">Loading Einkgram…</div>
    <div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25" style="
      position: relative;
      width: 16rem;
      max-width: 80%;
      height: 0.5rem;
      background-color: #ffffff;
      border: 2px solid #000000;
      box-sizing: content-box;
      overflow: hidden;
    ">
      <div style="
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 25%;
        background-color: #000000;
      "></div>
    </div>
  </div>
  <div id="portals"></div>
  <script vite-ignore src="./compatTest.js"></script>
  <script type="module" src="./src/index.tsx"></script>
  <script type="module" src="./src/eink/init.ts"></script>
</body>

</html>
