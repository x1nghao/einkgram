<!DOCTYPE html>
<!--
  Einkgram v0.11

  html.class is hard-coded here because upstream's theme
  logic runs in JS *after* the first paint. Without this,
  users on dark-mode systems see a black flash before
  init.ts adds theme-light.

  v0.11: Removed filter:grayscale(1) — E-Ink drivers handle
  grayscale at the display level. Removed all !important
  CSS variable overrides — upstream's light-mode values
  are correct. Removed pattern-background workaround —
  _patternBackground now has the eink-mode gate in source.
-->
<html lang="en" translate="no" class="notranslate theme-light eink-mode">

<head>
  <meta charset="UTF-8">

  <title>
    %TG_APP_TITLE%
  </title>

  <meta name="title" content="%TG_APP_TITLE%">
  <meta name="description"
    content="Telegram is a cloud-based mobile and desktop messaging app with a focus on security and speed.">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-title" content="%TG_APP_TITLE%">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="%TG_APP_TITLE%">
  <meta name="application-name" content="%TG_APP_TITLE%">
  <meta name="msapplication-TileColor" content="#2b5797">
  <meta name="msapplication-config" content="./browserconfig.xml">
  <meta name="theme-color" content="#ffffff">
  <meta name="google" content="notranslate">

  <meta http-equiv="Content-Security-Policy" content="%TG_CSP%">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="%TG_PUBLIC_URL%">
  <meta property="og:title" content="%TG_APP_TITLE%">
  <meta property="og:description"
        content="Telegram is a cloud-based mobile and desktop messaging app with a focus on security and speed.">
  <meta property="og:image" content="./%TG_MAIN_ICON%.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="%TG_PUBLIC_URL%">
  <meta property="twitter:title" content="%TG_APP_TITLE%">
  <meta property="twitter:description"
    content="Telegram is a cloud-based mobile and desktop messaging app with a focus on security and speed.">
  <meta property="twitter:image" content="./%TG_MAIN_ICON%.png">

  <link rel="canonical" href="%TG_PUBLIC_URL%">
  <link rel="apple-touch-icon" sizes="180x180" href="./%TG_APPLE_ICON%.png">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./%TG_MAIN_ICON%.png">
  <link rel="alternate icon" href="./favicon.ico" type="image/x-icon">
  <link rel="manifest" id="the-manifest-placeholder" href="./%TG_MANIFEST%">

  <script vite-ignore src="./redirect.js"></script>

  <!--
    Einkgram v0.11 — anti-flicker baseline only.

    We set paper-white background + light color-scheme in
    a blocking <style> so the first paint is white even if
    the system prefers dark. No !important overrides — the
    upstream SCSS light-mode variables are correct.

    The aggressive 28-var !important block from v0.10 is
    DELETED. filter:grayscale(1) is DELETED (E-Ink drivers
    handle this at the display level).
  -->
  <style>
    html, body {
      background-color: #ffffff;
      color: #000000;
      color-scheme: light;
    }
    @layer reset, variables, ui, components;
    @layer ui {
      @layer tablist, spinner, button, input, layout;
    }
  </style>

  <!--
    Einkgram v0.19 — Anti-flicker guard.

    Upstream's theme.ts writes CSS variables dynamically via JS
    after first paint. If the user's system prefers dark mode,
    there's a window where the page flashes dark before theme.ts
    runs and applies theme-light.

    This inline script runs synchronously before any JS module.
    If E-Ink mode is enabled (the default), it injects a
    <style> block that forces white background with maximum
    specificity, overriding any dynamic theme variables. The
    guard is removed once init.ts completes.
  -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('eink-mode');
        if (mode === null) mode = 'on';
        if (mode !== 'on') return;

        var guard = document.createElement('style');
        guard.id = 'eink-anti-flicker-guard';
        guard.textContent = [
          'html, html.theme-dark, html.theme-light {',
          '  background-color: #ffffff !important;',
          '  color: #000000 !important;',
          '  color-scheme: light !important;',
          '}',
          'html.theme-dark {',
          '  --theme-background-color: #ffffff !important;',
          '  --background-color: #ffffff !important;',
          '}'
        ].join('\n');
        (document.head || document.documentElement).appendChild(guard);
      } catch (e) {
        // localStorage blocked (privacy mode) — skip guard.
      }
    })();
  </script>
</head>

<body id="root">
  <noscript>
    <video src="./nojs.mp4" class="nojs-video" muted loop autoplay playsinline disablePictureInPicture></video>
    <h1>Telegram Web</h1>
    <p>Please, enable JavaScript to open the app.</p>
  </noscript>

  <!-- Einkgram v0.9: pre-React loading screen -->
  <div id="eink-loading-screen" role="status" aria-live="polite" style="
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%; height: 100%; padding: 2rem;
    background-color: #ffffff; color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 1rem; font-weight: 500;
    line-height: 1.5; text-align: center;
    box-sizing: border-box; margin: 0;
  ">
    <div style="margin-bottom: 1.5rem; letter-spacing: 0.025em;">Loading Einkgram…</div>
    <div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25" style="
      position: relative; width: 16rem; max-width: 80%; height: 0.5rem;
      background-color: #ffffff; border: 2px solid #000000;
      box-sizing: content-box; overflow: hidden;
    ">
      <div style="position: absolute; top: 0; left: 0; bottom: 0; width: 25%; background-color: #000000;"></div>
    </div>
  </div>

  <div id="portals"></div>
  <script vite-ignore src="./compatTest.js"></script>
  <script type="module" src="./src/index.tsx"></script>
  <script type="module" src="./src/eink/init.ts"></script>
</body>

</html>
