  <!--
    Einkgram: paper-white background and light color-scheme in a blocking <style>,
    so the first paint is white even if the system prefers dark.
  -->

  <!--
    Einkgram: anti-flicker guard. Upstream writes theme CSS variables via JS after
    first paint; on dark-mode systems there is a window where the page flashes dark
    before the light theme applies. This synchronous script injects a <style> block
    forcing a white background with maximum specificity; init.ts removes the guard
    once the eink mode is applied.
  -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('eink-mode');
        if (mode === null) mode = 'on';
        if (mode !== 'on') return;

        var guard = document.createElement('style');
        guard.id = 'eink-anti-flicker-guard';
        guard.textContent = [
          'html, html.theme-dark, html.theme-light {',
          '  background-color: #ffffff !important;',
          '  color: #000000 !important;',
          '  color-scheme: light !important;',
          '}',
          'html.theme-dark {',
          '  --theme-background-color: #ffffff !important;',
          '  --background-color: #ffffff !important;',
          '}'
        ].join('\n');
        (document.head || document.documentElement).appendChild(guard);
      } catch (e) {
        // localStorage blocked (privacy mode) — skip guard.
      }
    })();
  </script>
